name: Build, test and deploy to GitHub Pages
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env: { NEXT_PUBLIC_APP_URL: "https://app.test", NEXT_PUBLIC_BASE_PATH: "" }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env: { NEXT_PUBLIC_APP_URL: "https://app.test", NEXT_PUBLIC_BASE_PATH: "/factuio-portal" }
      - run: npx playwright test tests/e2e/base-path.spec.ts
        env: { PW_BASE_PATH: "/factuio-portal" }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deployment
        uses: actions/deploy-pages@v4
